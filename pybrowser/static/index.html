<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser Terminal</title>
    <!-- Load xterm.js CSS and JS from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        body { background: #1e1e1e; color: #fff; font-family: monospace; padding: 20px; }
        #terminal { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <h2>Interactive Web Terminal</h2>
    <div id="terminal"></div>

    <script>
        // 1. Initialize xterm.js
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#1e1e1e', foreground: '#ffffff' }
        });
        term.open(document.getElementById('terminal'));

        // 2. Connect to WebSocket (detects HTTP/HTTPS to use ws:// or wss://)
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/terminal`);
        socket.binaryType = "arraybuffer";

        // 3. Receive shell output from backend -> print in xterm
        socket.onmessage = (event) => {
            term.write(new Uint8Array(event.data));
        };

        // 4. Capture user keystrokes -> send to backend shell
        term.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(data);
            }
        });

        socket.onopen = () => term.write("\r\n*** Connected to Remote Shell ***\r\n\r\n");
        socket.onclose = () => term.write("\r\n*** Connection Closed ***\r\n");
    </script>
</body>
</html>
